name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-vulkan-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cmake \
            g++ \
            glslc \
            libglfw3-dev \
            libvulkan-dev \
            ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compile shaders and renderer
        run: cmake --build build --parallel 2

      - name: Run asset-contract tests
        run: ctest --test-dir build --output-on-failure
